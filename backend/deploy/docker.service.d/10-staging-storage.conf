# Install only on the staging EC2 host after installing the guard script.
# This protects Docker-managed restarts as well as initial deployment.
[Unit]
RequiresMountsFor=/srv/syncvitals
BindsTo=srv-syncvitals.mount
After=srv-syncvitals.mount

[Service]
ExecStartPre=/usr/bin/python3 /opt/syncvitals/deployment/scripts/staging_storage.py
