services:
    web:
      build:
        context: .
        dockerfile: Dockerfile
        target: development
      working_dir: /app
      command: >
        sh -c "python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000"
      env_file:
        - .env
      volumes:
        - .:/app
      ports:
        - "8000:8000"
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started

    web-e2e:
      profiles: ["e2e"]
      build:
        context: .
        dockerfile: Dockerfile
        target: development
      working_dir: /app
      command: >
        sh -c "python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000"
      environment:
        DJANGO_SETTINGS_MODULE: config.settings.e2e
        # Separate database URL so Playwright never writes into normal dev data.
        E2E_DATABASE_URL: postgresql://postgres:postgres@db-e2e:5432/longevity_e2e
        REDIS_URL: redis://redis:6379/1
        # Process-level overrides prevent base.py from loading real developer
        # Stripe credentials from the bind-mounted .env file.
        STRIPE_SECRET_KEY: e2e-stripe-api-disabled
        STRIPE_WEBHOOK_SECRET: e2e-webhook-disabled
        STRIPE_CHECKOUT_SUCCESS_URL: http://127.0.0.1:5173/settings?checkout=success
        STRIPE_CHECKOUT_CANCEL_URL: http://127.0.0.1:5173/settings?checkout=cancelled
        STRIPE_CUSTOMER_PORTAL_RETURN_URL: http://127.0.0.1:5173/settings
      volumes:
        - .:/app
      ports:
        - "8001:8000"
      depends_on:
        db-e2e:
          condition: service_healthy
        redis:
          condition: service_started

    celery:
      build:
        context: .
        dockerfile: Dockerfile
        target: development
      working_dir: /app
      command: ["celery", "-A", "config", "worker", "-l", "info"]
      env_file:
        - .env
      volumes:
        - .:/app
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started

    celery-beat:
      build:
        context: .
        dockerfile: Dockerfile
        target: development
      working_dir: /app
      command: ["celery", "-A", "config", "beat", "-l", "info"]
      env_file:
        - .env
      volumes:
        - .:/app
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_started

    db:
      image: timescale/timescaledb:latest-pg16
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 20

    db-e2e:
      profiles: ["e2e"]
      image: timescale/timescaledb:latest-pg16
      environment:
        POSTGRES_DB: longevity_e2e
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
      ports:
        - "5433:5432"
      volumes:
        - pgdata_e2e:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d longevity_e2e"]
        interval: 5s
        timeout: 5s
        retries: 20

    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"

volumes:
  pgdata:
  pgdata_e2e:
