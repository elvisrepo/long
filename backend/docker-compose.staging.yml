x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-backend-image: &backend-image
  image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
  pull_policy: always
  logging: *bounded-logging

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.prod
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required}"
  PII_ENCRYPTION_KEY: "${PII_ENCRYPTION_KEY:?PII_ENCRYPTION_KEY is required}"
  EMAIL_LOOKUP_KEY: "${EMAIL_LOOKUP_KEY:?EMAIL_LOOKUP_KEY is required}"
  JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}"
  DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}"
  STRIPE_CHECKOUT_SUCCESS_URL: "${STRIPE_CHECKOUT_SUCCESS_URL:?STRIPE_CHECKOUT_SUCCESS_URL is required}"
  STRIPE_CHECKOUT_CANCEL_URL: "${STRIPE_CHECKOUT_CANCEL_URL:?STRIPE_CHECKOUT_CANCEL_URL is required}"
  STRIPE_CUSTOMER_PORTAL_RETURN_URL: "${STRIPE_CUSTOMER_PORTAL_RETURN_URL:?STRIPE_CUSTOMER_PORTAL_RETURN_URL is required}"
  SES_REGION: "${SES_REGION:?SES_REGION is required}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:?DEFAULT_FROM_EMAIL is required}"
  PASSWORD_RESET_URL: "${PASSWORD_RESET_URL:?PASSWORD_RESET_URL is required}"
  LOG_LEVEL: "${LOG_LEVEL:?LOG_LEVEL is required}"
  DJANGO_LOG_LEVEL: "${DJANGO_LOG_LEVEL:?DJANGO_LOG_LEVEL is required}"
  REDIS_URL: redis://redis:6379/0
  NVIDIA_INSIGHTS_MODEL: nvidia/nemotron-3.5-super-vl-120b-a12b
  STRETCH_IMAGE_BUCKET: "${STRETCH_IMAGE_BUCKET:-}"

services:
  database:
    image: "postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94"
    logging: *bounded-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: longevity
      POSTGRES_USER: longevity
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - type: bind
        source: /srv/syncvitals/postgresql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longevity -d longevity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migration:
    <<: *backend-image
    environment: *backend-environment
    command: ["python", "manage.py", "migrate", "--no-input"]
    depends_on:
      database:
        condition: service_healthy

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    logging: *bounded-logging
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend-image
    restart: unless-stopped
    environment: *backend-environment
    command: ["celery", "-A", "config", "worker", "--loglevel=warning", "--concurrency=1", "--hostname=staging-ai@%h"]
    mem_limit: 512m
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import socket
          from config.celery import app
          replies = app.control.inspect(destination=["staging-ai@" + socket.gethostname()], timeout=5).ping()
          raise SystemExit(0 if replies else 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    <<: *backend-image
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      database:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os
          import urllib.request
          host = next(h.strip().lstrip(".") for h in os.environ["ALLOWED_HOSTS"].split(",") if h.strip())
          if host == "*":
              host = "localhost"
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/health/ready/",
              headers={"Host": host, "X-Forwarded-Proto": "https"},
          )
          urllib.request.urlopen(request, timeout=3).close()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
