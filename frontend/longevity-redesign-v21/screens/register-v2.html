<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>longevity — Register v2</title>
<link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(0,229,160,.12),transparent 30rem),var(--bg);color:var(--text);font-family:var(--font-sans);padding:20px}.panel{width:min(440px,100%);border:1px solid var(--border);border-radius:24px;background:rgba(17,19,24,.85);box-shadow:0 24px 80px rgba(0,0,0,.35);padding:28px}h1{font-family:var(--font-heading);letter-spacing:-.04em;font-size:40px;margin:0}.eyebrow{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}form{display:grid;gap:14px;margin-top:18px}label{display:grid;gap:7px;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}input{border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:12px 13px;min-height:48px;font-size:16px;width:100%}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button{border:0;border-radius:12px;background:var(--accent);color:#00150f;padding:13px;font-family:var(--font-heading);font-weight:800;min-height:52px;font-size:16px;cursor:pointer}.hint{font-size:13px;color:var(--text-dim);margin:0}.foot{margin-top:16px;color:var(--text-dim);font-size:14px;text-align:center}.foot a{color:var(--accent);font-weight:700;text-decoration:none}.logo{color:var(--accent);font-family:var(--font-heading);font-weight:800;text-decoration:none}.meter{height:8px;border-radius:999px;background:#1f2535;overflow:hidden}.meter i{display:block;height:100%;width:60%;background:var(--accent)}@media(max-width:480px){body{padding:14px}.panel{padding:20px}h1{font-size:32px}}
</style></head>
<body><main class="panel"><a class="logo" href="#">⬡ longevity</a><p class="eyebrow" style="margin-top:14px">Create account</p><h1 data-od-id="register-title">Register</h1><p style="color:var(--text-dim)">Maps to <span style="font-family:var(--font-mono)">registerWeb → /login</span>. No extra fields added.</p>
<form onsubmit="return false" data-od-id="register-form"><label>Email<input type="email" value="mara@example.com"></label><label>Password<input type="password" value="password123"></label><div><div class="meter"><i></i></div><p class="hint">Use 12+ characters. We never log the raw password — only the API error surfaces.</p></div><button data-od-id="cta-register">Register</button></form>
<p class="foot">Have an account? <a href="login-v2.html">Login →</a></p></main></body></html>
