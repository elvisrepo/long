name: Frontend CI

on:
  push:
    branches-ignore:
      - staging
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      # Step 1. Check out the exact commit or pull-request revision under test.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2. Load pinned Node.js and configure npm dependency caching.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3. Install exactly the dependency versions in package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Step 4. Fail on known high- or critical-severity dependency findings.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Step 5. Run the complete frontend unit and component test suite.
      - name: Run tests
        run: npm test

      # Step 6. Reject JavaScript, TypeScript, and React lint violations.
      - name: Lint
        run: npm run lint

      # Step 7. Verify that all tracked frontend files use canonical formatting.
      - name: Check formatting
        run: npm run format:check

      # Step 8. Type-check and compile the optimized production assets.
      - name: Build production assets
        run: npm run build
