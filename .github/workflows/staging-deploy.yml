name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    environment: staging
    runs-on: ubuntu-24.04
    env:
      EXPECTED_AWS_ACCOUNT_ID: "173291122778"
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      STAGING_INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
      STAGING_FRONTEND_BUCKET: ${{ vars.STAGING_FRONTEND_BUCKET }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      DEPLOY_COMPONENT: ${{ inputs.component }}
    steps:
      - name: Checkout reviewed staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "173291122778"
          role-session-name: staging-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Validate staging targets
        shell: bash
        run: |
          set -euo pipefail

          identity="$(aws sts get-caller-identity --output json)"
          account_id="$(jq -r '.Account' <<<"$identity")"
          assumed_role_arn="$(jq -r '.Arn' <<<"$identity")"
          expected_role_prefix="arn:aws:sts::173291122778:assumed-role/syncvitals-staging-github-deploy-role/"

          test "$account_id" = "173291122778"
          [[ "$assumed_role_arn" == "$expected_role_prefix"* ]]
          test "$AWS_REGION" = "eu-central-1"
          test "$ECR_REPOSITORY" = "syncvitals/staging/backend"
          test "$STAGING_INSTANCE_ID" = "i-08fbc9f0c53265b63"
          test "$STAGING_FRONTEND_BUCKET" = "syncvitals-staging-frontend-173291122778-eu-central-1-an"
          test "$STAGING_BASE_URL" = "https://staging.syncvitals.space"
          [[ "$DEPLOY_COMPONENT" =~ ^(backend|frontend|both)$ ]]

      - name: Set up ARM64 emulation
        if: inputs.component == 'backend' || inputs.component == 'both'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        if: inputs.component == 'backend' || inputs.component == 'both'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish backend image
        if: inputs.component == 'backend' || inputs.component == 'both'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          registry="${EXPECTED_AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          repository_uri="${registry}/${ECR_REPOSITORY}"
          describe_error="$RUNNER_TEMP/ecr-describe-error.txt"
          if existing_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>"$describe_error")"; then
            [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf 'Reusing published backend image: `%s@%s`\n' \
              "$repository_uri" "$existing_digest" >> "$GITHUB_STEP_SUMMARY"
          else
            if ! grep --quiet 'ImageNotFoundException' "$describe_error"; then
              cat "$describe_error" >&2
              exit 1
            fi
            cleanup_ecr_auth() {
              docker logout "$registry" >/dev/null 2>&1 || true
            }
            trap cleanup_ecr_auth EXIT

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$registry"
            docker buildx build \
              --platform linux/arm64 \
              --target production \
              --tag "$repository_uri:${GITHUB_SHA}" \
              --push \
              .
          fi

      - name: Refresh backend deployment credentials
        if: inputs.component == 'backend' || inputs.component == 'both'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "173291122778"
          role-session-name: staging-deploy-backend-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Resolve and approve backend image
        if: inputs.component == 'backend' || inputs.component == 'both'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          repository_uri="${EXPECTED_AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          index_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$index_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          index_manifest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageDigest=$index_digest" \
            --accepted-media-types application/vnd.oci.image.index.v1+json \
            --region "$AWS_REGION" \
            --query 'images[0].imageManifest' \
            --output text)"
          arm64_digest="$(printf '%s' "$index_manifest" \
            | python3 scripts/staging_image.py arm64-digest)"

          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$arm64_digest" \
            --region "$AWS_REGION"
          aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$arm64_digest" \
            --region "$AWS_REGION" \
            --output json \
            | python3 scripts/staging_image.py review-scan

          printf 'BACKEND_IMAGE=%s\n' "$repository_uri@$index_digest" >> "$GITHUB_ENV"
          printf 'Candidate backend image: `%s`\n' "$repository_uri@$index_digest" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and verify backend
        if: inputs.component == 'backend' || inputs.component == 'both'
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          parameters_file="$RUNNER_TEMP/staging-ssm-parameters.json"
          python3 scripts/staging_ssm.py \
            --backend-image "$BACKEND_IMAGE" \
            --region "$AWS_REGION" \
            > "$parameters_file"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$STAGING_INSTANCE_ID" \
            --comment "Deploy backend ${GITHUB_SHA}" \
            --parameters "file://$parameters_file" \
            --timeout-seconds 60 \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)"

          invocation_error="$RUNNER_TEMP/ssm-invocation-error.txt"
          poll_deadline=$((SECONDS + 1020))
          while true; do
            if invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$STAGING_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --output json 2>"$invocation_error")"; then
              status="$(jq -r '.Status' <<<"$invocation")"
              stdout="$(jq -r '.StandardOutputContent' <<<"$invocation")"
              stderr="$(jq -r '.StandardErrorContent' <<<"$invocation")"
              case "$status" in
                Success)
                  break
                  ;;
                Pending|InProgress|Delayed|Cancelling)
                  if (( SECONDS >= poll_deadline )); then
                    printf 'SSM command did not reach terminal status before the safety deadline.\n' >&2
                    exit 1
                  fi
                  sleep 5
                  ;;
                Cancelled|Failed|TimedOut|Undeliverable|Terminated)
                  printf '%s\n' "$stdout"
                  printf '%s\n' "$stderr" >&2
                  exit 1
                  ;;
                *)
                  printf 'Unexpected SSM invocation status: %s\n' "$status" >&2
                  exit 1
                  ;;
              esac
            else
              if (( SECONDS >= poll_deadline )); then
                cat "$invocation_error" >&2
                printf 'Unable to confirm terminal SSM status before the safety deadline.\n' >&2
                exit 1
              fi
              sleep 5
            fi
          done
          printf '%s\n' "$stdout"

          previous_backend_image="$(sed -n 's/^previous_backend_image=//p' <<<"$stdout")"
          running_backend_image="$(sed -n 's/^running_backend_image=//p' <<<"$stdout")"
          [[ "$previous_backend_image" =~ ^[0-9a-zA-Z./:_-]+@sha256:[0-9a-f]{64}$ ]]
          test "$running_backend_image" = "$BACKEND_IMAGE"
          {
            printf '### Backend deployment\n\n'
            printf -- '- Previous backend rollback image: `%s`\n' "$previous_backend_image"
            printf -- '- Running backend image: `%s`\n' "$running_backend_image"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        if: inputs.component == 'frontend' || inputs.component == 'both'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        if: inputs.component == 'frontend' || inputs.component == 'both'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          npm ci
          npm audit --audit-level=high
          npm test
          npm run lint
          npm run format:check
          npm run build
          npm run deploy:static -- \
            --bucket "$STAGING_FRONTEND_BUCKET" \
            --dry-run

      - name: Refresh frontend deployment credentials
        if: inputs.component == 'frontend' || inputs.component == 'both'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "173291122778"
          role-session-name: staging-deploy-frontend-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Upload frontend assets
        if: inputs.component == 'frontend' || inputs.component == 'both'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          npm run deploy:static -- --bucket "$STAGING_FRONTEND_BUCKET"
          {
            printf '### Frontend deployment\n\n'
            printf -- '- Deployed source commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Rollback: rebuild the previous known-good commit; S3 Versioning retains overwritten object versions.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify public staging application
        shell: bash
        run: |
          set -euo pipefail

          root_shell="$RUNNER_TEMP/staging-root.html"
          deep_link_shell="$RUNNER_TEMP/staging-deep-link.html"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "${STAGING_BASE_URL}/?release=${GITHUB_SHA}" \
            --output "$root_shell"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors \
            "${STAGING_BASE_URL}/metrics/sleep_duration?release=${GITHUB_SHA}" \
            --output "$deep_link_shell"
          cmp --silent "$root_shell" "$deep_link_shell"

          if [[ "$DEPLOY_COMPONENT" == "frontend" || "$DEPLOY_COMPONENT" == "both" ]]; then
            cmp --silent frontend/dist/index.html "$root_shell"
          fi

          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "${STAGING_BASE_URL}/api/v1/health/live/" >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors \
            "${STAGING_BASE_URL}/api/v1/health/ready/" >/dev/null
          printf 'Public root, deep link, liveness, and readiness checks passed.\n' \
            >> "$GITHUB_STEP_SUMMARY"
